name: publish

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # For Trusted Publishing (OIDC) this permission is required; harmless otherwise.
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # If you configured PyPI Trusted Publishing, no password is needed.
          # Otherwise set a repo secret PYPI_TOKEN (pypi.org → Account → API token).
          password: ${{ secrets.PYPI_TOKEN }}
