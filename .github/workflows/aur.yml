name: aur

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AUR_SSH_KEY }}
      - name: Publish to AUR
        run: |
          ssh-keyscan -t rsa aur.archlinux.org >> ~/.ssh/known_hosts
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          rm -rf aur-repo && mkdir aur-repo && cd aur-repo
          git init -q
          git branch -M master
          git remote add origin ssh://aur@aur.archlinux.org/vantage-git.git
          cp ../aur/PKGBUILD ../aur/.SRCINFO .
          git add -A
          git commit -q -m "Update to ${{ github.ref_name }}"
          git push -u origin master
